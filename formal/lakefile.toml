name = "formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Formal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Formal"

# Quarantined exploration sandbox (CLAUDE.md § Explorations). NOT a default target, so
# `lake build` and the lean-check CI job never build it; the spine must not import it
# (scripts/exploration_check.py enforces both). Build: `lake build ExplorePenrose`.
[[lean_lib]]
name = "ExplorePenrose"
srcDir = "explore/penrose/lean"
